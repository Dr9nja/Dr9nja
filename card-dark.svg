<svg xmlns="http://www.w3.org/2000/svg"
    width="600"
    height="210"
    viewBox="0 0 600 210">

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #c9d1d9;
      }

      .stat-text {
        font-family: ui-monospace, SFMono-Regular, SF Mono,
          Menlo, Consolas, monospace;
        font-size: 13px;
        fill: #8b949e;
      }

      .lang-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #f0f6fc;
      }

      .pct-text {
        font-family: ui-monospace, SFMono-Regular, SF Mono,
          Menlo, Consolas, monospace;
        font-size: 12px;
        fill: #8b949e;
      }
    </style>

    <rect
      width="600"
      height="210"
      rx="12"
      fill="#0d1117"
      stroke="#30363d"
      stroke-width="1"
    />

    <text x="24" y="36" class="title">Dr9nja</text>

    <text x="24" y="58" class="stat-text">
      @Dr9nja · 8 repos
    </text>

    <g id="progress-bar">
      <rect x="24" y="80" width="214.1" height="10" fill="#f1e05a" />
<rect x="238.1" y="80" width="131.3" height="10" fill="#3572A5" />
<rect x="369.4" y="80" width="117.4" height="10" fill="#178600" />
<rect x="486.8" y="80" width="65.1" height="10" fill="#563d7c" />
<rect x="551.9" y="80" width="24.1" height="10" fill="#e34c26" />
    </g>

    
    <g transform="translate(24, 125)">
      <circle cx="5" cy="-5" r="5" fill="#f1e05a"/>
      <text x="18" y="0" class="lang-text">
        JavaScript
        <tspan class="pct-text">38.8%</tspan>
      </text>
    </g>
    <g transform="translate(210, 125)">
      <circle cx="5" cy="-5" r="5" fill="#3572A5"/>
      <text x="18" y="0" class="lang-text">
        Python
        <tspan class="pct-text">23.8%</tspan>
      </text>
    </g>
    <g transform="translate(396, 125)">
      <circle cx="5" cy="-5" r="5" fill="#178600"/>
      <text x="18" y="0" class="lang-text">
        C#
        <tspan class="pct-text">21.3%</tspan>
      </text>
    </g>
    <g transform="translate(24, 160)">
      <circle cx="5" cy="-5" r="5" fill="#563d7c"/>
      <text x="18" y="0" class="lang-text">
        CSS
        <tspan class="pct-text">11.8%</tspan>
      </text>
    </g>
    <g transform="translate(210, 160)">
      <circle cx="5" cy="-5" r="5" fill="#e34c26"/>
      <text x="18" y="0" class="lang-text">
        HTML
        <tspan class="pct-text">4.4%</tspan>
      </text>
    </g>
  </svg>