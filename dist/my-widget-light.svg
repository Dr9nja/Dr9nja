
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="210"
  viewBox="0 0 600 210"
>

  <style>

    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 18px;
      font-weight: 600;
      fill: #1d1d1f;
    }

    .stat-text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        SF Mono,
        Menlo,
        Consolas,
        monospace;

      font-size: 13px;
      fill: #57606a;
    }

    .lang-text {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 13px;
      font-weight: 500;
      fill: #24292f;
    }

    .pct-text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        SF Mono,
        Menlo,
        Consolas,
        monospace;

      font-size: 12px;
      fill: #57606a;
    }

  </style>

  <!-- Header Info -->

  <text
    x="24"
    y="36"
    class="title"
  >
    My most used languages 💚🖤
  </text>


  <text
    x="24"
    y="58"
    class="stat-text"
  >
    @Dr9nja · 6 repos · 141 commits · 8 streak in days
  </text>


  <!-- Multi-Color Progress Bar -->

  <g id="progress-bar">

    
    <rect
      x="24.00"
      y="80"
      width="164.83"
      height="10"
      fill="#3572A5"
    />
    <rect
      x="188.83"
      y="80"
      width="133.16"
      height="10"
      fill="#7355dd"
    />
    <rect
      x="321.99"
      y="80"
      width="91.98"
      height="10"
      fill="#3178c6"
    />
    <rect
      x="413.96"
      y="80"
      width="66.35"
      height="10"
      fill="#f1e05a"
    />
    <rect
      x="480.32"
      y="80"
      width="58.00"
      height="10"
      fill="#663399"
    />
    <rect
      x="538.32"
      y="80"
      width="37.68"
      height="10"
      fill="#e34c26"
    />

  </g>


  <!-- Legend -->

  
  <g transform="translate(24, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#3572A5"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      Python
      <tspan class="pct-text">
        29.9%
      </tspan>
    </text>
  </g>

  <g transform="translate(210, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#7355dd"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      C#
      <tspan class="pct-text">
        24.1%
      </tspan>
    </text>
  </g>

  <g transform="translate(390, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#3178c6"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      TypeScript
      <tspan class="pct-text">
        16.7%
      </tspan>
    </text>
  </g>

  <g transform="translate(24, 160)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#f1e05a"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      JavaScript
      <tspan class="pct-text">
        12.0%
      </tspan>
    </text>
  </g>

  <g transform="translate(210, 160)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#663399"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      CSS
      <tspan class="pct-text">
        10.5%
      </tspan>
    </text>
  </g>

  <g transform="translate(390, 160)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#e34c26"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      HTML
      <tspan class="pct-text">
        6.8%
      </tspan>
    </text>
  </g>



</svg>
