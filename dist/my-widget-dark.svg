
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="210"
  viewBox="0 0 600 210"
>

  <style>

    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 18px;
      font-weight: 600;
      fill: #f0f6fc;
    }

    .stat-text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        SF Mono,
        Menlo,
        Consolas,
        monospace;

      font-size: 13px;
      fill: #8b949e;
    }

    .lang-text {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 13px;
      font-weight: 500;
      fill: #f0f6fc;
    }

    .pct-text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        SF Mono,
        Menlo,
        Consolas,
        monospace;

      font-size: 12px;
      fill: #8b949e;
    }

  </style>

  <!-- Header Info -->

  <text
    x="24"
    y="36"
    class="title"
  >
    My most used languages 💚🖤
  </text>


  <text
    x="24"
    y="58"
    class="stat-text"
  >
    @Dr9nja · 6 repos · 91 commits · 6 streak in days
  </text>


  <!-- Multi-Color Progress Bar -->

  <g id="progress-bar">

    
    <rect
      x="24.00"
      y="80"
      width="228.39"
      height="10"
      fill="#3572A5"
    />
    <rect
      x="252.39"
      y="80"
      width="184.51"
      height="10"
      fill="#7355dd"
    />
    <rect
      x="436.90"
      y="80"
      width="91.94"
      height="10"
      fill="#f1e05a"
    />
    <rect
      x="528.85"
      y="80"
      width="25.79"
      height="10"
      fill="#663399"
    />
    <rect
      x="554.63"
      y="80"
      width="21.37"
      height="10"
      fill="#e34c26"
    />

  </g>


  <!-- Legend -->

  
  <g transform="translate(24, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#3572A5"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      Python
      <tspan class="pct-text">
        41.4%
      </tspan>
    </text>
  </g>

  <g transform="translate(210, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#7355dd"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      C#
      <tspan class="pct-text">
        33.4%
      </tspan>
    </text>
  </g>

  <g transform="translate(390, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#f1e05a"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      JavaScript
      <tspan class="pct-text">
        16.7%
      </tspan>
    </text>
  </g>

  <g transform="translate(24, 160)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#663399"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      CSS
      <tspan class="pct-text">
        4.7%
      </tspan>
    </text>
  </g>

  <g transform="translate(210, 160)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#e34c26"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      HTML
      <tspan class="pct-text">
        3.9%
      </tspan>
    </text>
  </g>



</svg>
