
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="210"
  viewBox="0 0 600 210"
>

  <style>

    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 18px;
      font-weight: 600;
      fill: #f0f6fc;
    }

    .stat-text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        SF Mono,
        Menlo,
        Consolas,
        monospace;

      font-size: 13px;
      fill: #8b949e;
    }

    .lang-text {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-size: 13px;
      font-weight: 500;
      fill: #f0f6fc;
    }

    .pct-text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        SF Mono,
        Menlo,
        Consolas,
        monospace;

      font-size: 12px;
      fill: #8b949e;
    }

  </style>

  <!-- Header Info -->

  <text
    x="24"
    y="36"
    class="title"
  >
    My most used languages 💚🖤
  </text>


  <text
    x="24"
    y="58"
    class="stat-text"
  >
    @Dr9nja · 6 repos · 112 commits · 7 streak in days
  </text>


  <!-- Multi-Color Progress Bar -->

  <g id="progress-bar">

    
    <rect
      x="24.00"
      y="80"
      width="184.61"
      height="10"
      fill="#3572A5"
    />
    <rect
      x="208.61"
      y="80"
      width="149.15"
      height="10"
      fill="#7355dd"
    />
    <rect
      x="357.76"
      y="80"
      width="74.32"
      height="10"
      fill="#f1e05a"
    />
    <rect
      x="432.08"
      y="80"
      width="63.80"
      height="10"
      fill="#3178c6"
    />
    <rect
      x="495.88"
      y="80"
      width="42.21"
      height="10"
      fill="#e34c26"
    />
    <rect
      x="538.09"
      y="80"
      width="37.91"
      height="10"
      fill="#663399"
    />

  </g>


  <!-- Legend -->

  
  <g transform="translate(24, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#3572A5"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      Python
      <tspan class="pct-text">
        33.4%
      </tspan>
    </text>
  </g>

  <g transform="translate(210, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#7355dd"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      C#
      <tspan class="pct-text">
        27.0%
      </tspan>
    </text>
  </g>

  <g transform="translate(390, 125)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#f1e05a"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      JavaScript
      <tspan class="pct-text">
        13.5%
      </tspan>
    </text>
  </g>

  <g transform="translate(24, 160)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#3178c6"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
