      HTML
      <tspan class="pct-text">
        7.6%
      </tspan>
    </text>
  </g>

  <g transform="translate(390, 160)">
    <circle
      cx="5"
      cy="-5"
      r="5"
      fill="#663399"
    />

    <text
      x="18"
      y="0"
      class="lang-text"
    >
      CSS
      <tspan class="pct-text">
        6.9%
      </tspan>
    </text>
